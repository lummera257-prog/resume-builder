    <!-- CSS: Critical styles inline — prevent layout shift -->
    <style>
      /* Font fallback — prevent layout shift while fonts load */
      body {
        font-family: 'Geist', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 0;
      }

      /* Prevent body shift from Google Translate */
      body,
      body.translated-ltr,
      body.translated-rtl {
        top: 0 !important;
        margin-top: 0 !important;
        position: static !important;
      }

      /* Hide Google Translate bar */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame { display: none !important; }
      .goog-te-gadget              { display: none !important; }
      #google_translate_element    { display: none !important; }
      .goog-text-highlight         { background: none !important; box-shadow: none !important; }
      font[color="green"]          { color: inherit !important; }

      /* Root loading state */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8fafc;
      }
    </style>

    <!-- Google Translate — defer after page load -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
            multilanguagePage: true,
          },
          'google_translate_element'
        );
      }

      function loadGoogleTranslate() {
        var s = document.createElement('script');
        s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        s.async = true;
        s.defer = true;
        document.head.appendChild(s);
      }

      if (document.readyState === 'complete') {
        setTimeout(loadGoogleTranslate, 3000);
      } else {
        window.addEventListener('load', function () {
          setTimeout(loadGoogleTranslate, 3000);
        });
      }
    </script>

    <!-- JS: Force hide Google bar — runs after load only -->
    <script>
      (function () {
        function hideGoogleBar() {
          if (!document.body) return;
          document.body.style.top       = '0px';
          document.body.style.marginTop = '0px';
          document.body.style.position  = 'static';
          document
            .querySelectorAll('iframe.goog-te-banner-frame, .goog-te-banner-frame')
            .forEach(function (el) { el.style.display = 'none'; });
          document
            .querySelectorAll('.skiptranslate')
            .forEach(function (el) {
              if (el.tagName === 'IFRAME') el.style.display = 'none';
            });
        }

        window.addEventListener('load', function () {
          hideGoogleBar();
          var timer = setInterval(hideGoogleBar, 300);
          setTimeout(function () { clearInterval(timer); }, 15000);
          var observer = new MutationObserver(hideGoogleBar);
          observer.observe(document.body, { childList: true, subtree: true });
          setTimeout(function () { observer.disconnect(); }, 15000);
        });
      })();
    </script>
