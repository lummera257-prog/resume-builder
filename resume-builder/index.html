    <!-- JS: Force hide Google bar -->
    <script>
      (function () {
        function hideGoogleBar() {
          document.body.style.top        = '0px';
          document.body.style.marginTop  = '0px';
          document.body.style.position   = 'static';
          document
            .querySelectorAll('iframe.goog-te-banner-frame, .goog-te-banner-frame')
            .forEach(function (el) { el.style.display = 'none'; });
          document
            .querySelectorAll('.skiptranslate')
            .forEach(function (el) {
              if (el.tagName === 'IFRAME') el.style.display = 'none';
            });
        }
        hideGoogleBar();
        var timer = setInterval(hideGoogleBar, 200);
        setTimeout(function () { clearInterval(timer); }, 10000);
        var observer = new MutationObserver(hideGoogleBar);
        function startObserver() {
          observer.observe(document.body, { childList: true, subtree: true });
          setTimeout(function () { observer.disconnect(); }, 10000);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startObserver);
        } else {
          startObserver();
        }
      })();
    </script>
