    <!-- ✅ CSS: Hide Google Translate Bar immediately -->
    <style>
      /* Prevent body shift */
      body, body.translated-ltr, body.translated-rtl {
        top: 0 !important;
        margin-top: 0 !important;
        position: static !important;
      }
      /* Hide Google bar elements */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame { display: none !important; }
      .goog-te-gadget              { display: none !important; }
      #google_translate_element    { display: none !important; }
      .goog-text-highlight         { background: none !important; box-shadow: none !important; }
      font[color="green"]          { color: inherit !important; }

      /* ✅ Font fallback — prevent layout shift while fonts load */

      }
    </style>

    <!-- ✅ PERFORMANCE: Google Translate — load AFTER page is interactive -->
    <!-- Using setTimeout so it never blocks FCP/LCP -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
            multilanguagePage: true,
          },
          'google_translate_element'
        );
      }

      // ✅ Load Google Translate only after page is fully loaded
      // This prevents it from blocking FCP and TBT
      function loadGoogleTranslate() {
        var s = document.createElement('script');
        s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        s.async = true;
        s.defer = true;
        document.head.appendChild(s);
      }

      // Wait for page load — dont block render
      if (document.readyState === 'complete') {
        setTimeout(loadGoogleTranslate, 2000);
      } else {
        window.addEventListener('load', function() {
          setTimeout(loadGoogleTranslate, 2000);
        });
      }
    </script>

    <!-- ✅ JS: Force Hide Google Bar — runs after load -->
    <script>
      (function () {
        function hideGoogleBar() {
          if (!document.body) return;
          document.body.style.top       = '0px';
          document.body.style.marginTop = '0px';
          document.body.style.position  = 'static';
          document
            .querySelectorAll('iframe.goog-te-banner-frame, .goog-te-banner-frame')
            .forEach(function (el) { el.style.display = 'none'; });
          document
            .querySelectorAll('.skiptranslate')
            .forEach(function (el) {
              if (el.tagName === 'IFRAME') el.style.display = 'none';
            });
        }

        // ✅ Only run after page load — not during critical render
        window.addEventListener('load', function () {
          hideGoogleBar();
          var timer = setInterval(hideGoogleBar, 300);
          setTimeout(function () { clearInterval(timer); }, 15000);

          var observer = new MutationObserver(hideGoogleBar);
          observer.observe(document.body, { childList: true, subtree: true });
          setTimeout(function () { observer.disconnect(); }, 15000);
        });
      })();
    </script>
