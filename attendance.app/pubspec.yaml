name: payclock
description: PayClock — Attendance & Payroll Management for Indian Small Businesses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Backend
  supabase_flutter: ^2.5.0

  # Local Database
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Networking
  connectivity_plus: ^6.0.0
  dio: ^5.4.0

  # Firebase
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.1.0

  # Ads
  google_mobile_ads: ^5.1.0

  # Subscriptions
  purchases_flutter: '>=7.0.0 <11.0.0'

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Sharing & Links
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  open_file: ^3.3.2

  # UI
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
